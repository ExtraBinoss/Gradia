<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <style>
      @font-face {
        font-family: Heading;
        src: url("./assets/heading.woff2") format("woff2");
        font-weight: 300 700;
        font-display: block;
      }
      @font-face {
        font-family: Body;
        src: url("./assets/body.woff2") format("woff2");
        font-weight: 300 700;
        font-display: block;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #cef4df;
        color: #14261e;
        font-family: Body, sans-serif;
      }
      .gradient {
        position: absolute;
        inset: 0;
        width: 1200px;
        height: 630px;
        object-fit: cover;
      }
      header {
        position: absolute;
        left: 72px;
        top: 37px;
        display: flex;
        align-items: center;
        gap: 14px;
        color: #fff;
      }
      header img {
        width: 57px;
        height: 35px;
        object-fit: contain;
      }
      header span {
        font-family: Heading, sans-serif;
        font-size: 30px;
        font-weight: 500;
        letter-spacing: -1px;
      }
      .copy {
        position: absolute;
        left: 715px;
        right: 45px;
        top: 230px;
      }
      h1 {
        font-family: Heading, sans-serif;
        font-size: 76px;
        line-height: 1.01;
        letter-spacing: -4px;
        font-weight: 500;
        margin: 0 0 24px;
      }
      p {
        font-size: 23px;
        line-height: 1.3;
        margin: 0;
        color: #254e40;
      }
      .domain {
        position: absolute;
        right: 72px;
        bottom: 31px;
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 19px;
        color: #183b2b;
      }
      .domain svg {
        width: 19px;
        height: 19px;
      }
    </style>
  </head>
  <body>
    <img
      class="gradient"
      src="./assets/gradient.webp"
      alt="An actual Gradia gradient in mint, green and warm brown."
    />
    <header><img src="./assets/pk.svg" alt="Plinka" /><span>Gradia</span></header>
    <main class="copy">
      <h1>Color.<br />In motion.</h1>
      <p>Create a gradient.<br />Take it anywhere.</p>
    </main>
    <footer class="domain">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
      >
        <circle cx="12" cy="12" r="9" />
        <ellipse cx="12" cy="12" rx="4" ry="9" />
        <path d="M3 12h18" /></svg
      >gradia.plinka.eu
    </footer>
  </body>
</html>
